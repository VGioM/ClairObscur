[package]
name = "clairobscur"
version = "1.0.0"
edition = "2021"
description = "Choisir l'heure du passage du thème clair au thème sombre sous KDE Plasma"
license = "MIT"
publish = false

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui = "=0.31.1"
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
